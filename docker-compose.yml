services:
  yamtrack:
    container_name: yamtrack
    image: ghcr.io/fuzzygrim/yamtrack
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Asia/Shanghai
      - SECRET=${SECRET:-longstring}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./db:/yamtrack/db
      - ./posters:/yamtrack/staticfiles/posters
      - ./manual-metadata.json:/yamtrack/manual-metadata.json:ro
      - ./src/app/providers/manual.py:/yamtrack/app/providers/manual.py:ro
      - ./src/app/home.py:/yamtrack/app/home.py:ro
      - ./src/app/views.py:/yamtrack/app/views.py:ro
      - ./src/app/urls.py:/yamtrack/app/urls.py:ro
      - ./src/config/urls.py:/yamtrack/config/urls.py:ro
      - ./src/templates/base.html:/yamtrack/templates/base.html:ro
      - ./src/templates/app/media_details.html:/yamtrack/templates/app/media_details.html:ro
      - ./src/templates/app/components/home_section.html:/yamtrack/templates/app/components/home_section.html:ro
      - ./src/templates/app/components/home_grid.html:/yamtrack/templates/app/components/home_grid.html:ro
      - ./src/templates/app/manual_metadata_search.html:/yamtrack/templates/app/manual_metadata_search.html:ro
    ports:
      - "8000:8000"

  redis:
    container_name: yamtrack-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
